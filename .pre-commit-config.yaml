repos:
  - repo: local
    hooks:
      - id: alejandra
        name: alejandra
        entry: nix develop -c alejandra
        language: system
        files: \.nix$

      - id: deadnix
        name: deadnix
        entry: nix develop -c deadnix
        language: system
        files: \.nix$

      - id: statix
        name: statix
        entry: nix develop -c statix check
        language: system
        files: \.nix$
        pass_filenames: false
