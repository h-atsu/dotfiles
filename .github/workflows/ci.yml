name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flake-check:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Run pre-commit
        run: nix shell nixpkgs#pre-commit -c pre-commit run --all-files
